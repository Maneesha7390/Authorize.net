version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: payment_system_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment_system_backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001

      - MONGO_URI=mongodb://admin:password@mongodb:27017/payment_db?authSource=admin
      - AUTHORIZE_NET_LOGIN_ID=${AUTHORIZE_NET_LOGIN_ID}
      - AUTHORIZE_NET_TRANSACTION_KEY=${AUTHORIZE_NET_TRANSACTION_KEY}
      - AUTHORIZE_NET_SIGNATURE_KEY=${AUTHORIZE_NET_SIGNATURE_KEY}
      - AUTHORIZE_NET_ENVIRONMENT=${AUTHORIZE_NET_ENVIRONMENT:-sandbox}
    depends_on:
      - mongodb
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  mongodb_data:
